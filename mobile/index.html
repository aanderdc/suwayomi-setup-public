<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Suwayomi Móvil</title>
  <link rel="manifest" href="/movil/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/movil/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/movil/icon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="/movil/icon-192.png">
  <link rel="stylesheet" href="/movil/styles.css?v=8">
</head>
<body>
  <div id="app">
    <!-- Cabecera principal (pestañas) -->
    <header id="topHeader" class="top-header">
      <div class="header-row">
        <h1 id="headerTitle" class="header-title">Biblioteca</h1>
        <div id="headerActions" class="header-actions"></div>
      </div>
      <div id="headerSub" class="header-sub hidden"></div>
    </header>

    <!-- Banner de modo sin conexión (tipo Spotify) -->
    <div id="offlineBanner" class="offline-banner hidden">
      <span class="offline-dot"></span>
      <span class="offline-banner-text">Sin conexión con el PC · Solo capítulos descargados</span>
      <button id="offlineRetryBtn" class="offline-retry-btn" type="button">Conectar</button>
    </div>

    <!-- Banner de instalación directa como app (solo primera vez en navegador) -->
    <div id="installBanner" class="install-banner hidden">
      <img src="/movil/icon-192.png" alt="" class="install-banner-icon">
      <div class="install-banner-text">
        <strong>Instalar como app en tu móvil</strong>
        <span>Ábrela desde tu pantalla de inicio sin volver a escanear el QR.</span>
      </div>
      <button id="installBannerBtn" class="install-banner-btn" type="button">Instalar</button>
      <button id="installBannerClose" class="install-banner-close" type="button" aria-label="Cerrar">×</button>
    </div>

    <!-- Barra flotante de cola de descargas activas -->
    <div id="dlQueueBar" class="dl-queue-bar hidden">
      <div id="dlQueueInfo" class="dl-queue-info">Descargando...</div>
      <button id="dlQueuePauseBtn" class="offline-retry-btn" type="button">Pausar</button>
      <button id="dlQueueOpenBtn" class="offline-retry-btn" type="button">Cola</button>
    </div>

    <!-- Contenido principal de pestañas -->
    <main id="mainContent" class="main-content"></main>

    <!-- Barra de navegación inferior (5 pestañas) -->
    <nav id="bottomNav" class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-btn active" data-tab="library" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm10 0a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V6z"/></svg>
        <span>Biblioteca</span>
      </button>
      <button class="nav-btn" data-tab="updates" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5a6 6 0 0 0-5-5.9V4a1 1 0 0 0-2 0v1.1A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span>Novedades</span>
      </button>
      <button class="nav-btn" data-tab="recent" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10.4 3.2 1.9-.9 1.5L11 13.3V7h2z"/></svg>
        <span>Recientes</span>
      </button>
      <button class="nav-btn" data-tab="explore" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm3.9 6.1-2.1 5.7-5.7 2.1 2.1-5.7 5.7-2.1z"/></svg>
        <span>Explorar</span>
      </button>
      <button class="nav-btn" data-tab="settings" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5zM12 15.2A3.2 3.2 0 1 1 15.2 12 3.2 3.2 0 0 1 12 15.2z"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>

    <!-- Vista bóveda oculta (incógnito) -->
    <section id="vaultView" class="overlay-view vault-view hidden" aria-label="Bóveda oculta"></section>

    <!-- Vista detalle de manga -->
    <section id="mangaView" class="overlay-view hidden" aria-label="Detalle del manga"></section>

    <!-- Modal genérico inferior (categorías, migración, cola de descargas) -->
    <div id="appSheetBackdrop" class="sheet-backdrop hidden"></div>
    <div id="appSheet" class="bottom-sheet hidden"></div>

    <!-- Vista lector a pantalla completa estilo Manga Dogs -->
    <section id="readerView" class="reader-view hidden" aria-label="Lector de manga">
      <div id="readerDimmer" class="reader-dimmer"></div>

      <div id="readerStage" class="reader-stage"></div>

      <!-- HUD flotante de brillo al deslizar por el borde izquierdo -->
      <div id="readerBrightnessHud" class="reader-hud hidden"></div>

      <!-- Indicador discreto de página (esquina inferior) -->
      <div id="readerMiniStatus" class="reader-mini-status"></div>

      <!-- Barra superior flotante -->
      <div id="readerTopBar" class="reader-top-bar">
        <button id="readerBackBtn" class="icon-btn" type="button" aria-label="Volver">
          <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
        </button>
        <div class="reader-titles">
          <div id="readerMangaTitle" class="reader-manga-title"></div>
          <div id="readerChapterTitle" class="reader-chapter-title"></div>
        </div>
        <button id="readerBookmarkBtn" class="icon-btn" type="button" aria-label="Marcar página">
          <svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg>
        </button>
        <button id="readerChaptersBtn" class="icon-btn" type="button" aria-label="Lista de capítulos">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        </button>
        <button id="readerSettingsBtn" class="icon-btn" type="button" aria-label="Opciones de lectura">
          <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
        </button>
      </div>

      <!-- Barra inferior flotante -->
      <div id="readerBottomBar" class="reader-bottom-bar">
        <div class="reader-slider-row">
          <span id="readerPageNow" class="reader-page-num">1</span>
          <input id="readerSlider" class="reader-slider" type="range" min="1" max="1" value="1" aria-label="Página actual">
          <span id="readerPageTotal" class="reader-page-num">1</span>
        </div>
        <div class="reader-nav-row">
          <button id="readerPrevChap" class="reader-pill-btn" type="button">‹ Anterior</button>
          <button id="readerModeQuick" class="reader-pill-btn accent" type="button">Continuo (PDF)</button>
          <button id="readerNextChap" class="reader-pill-btn" type="button">Siguiente ›</button>
        </div>
      </div>

      <!-- Panel inferior de ajustes del lector -->
      <div id="readerSheetBackdrop" class="sheet-backdrop hidden"></div>
      <div id="readerSheet" class="bottom-sheet hidden"></div>
    </section>

    <!-- Pantalla de bloqueo con PIN opcional -->
    <div id="pinLockOverlay" class="pin-overlay hidden" aria-label="Bloqueo con PIN">
      <div class="pin-box">
        <img src="/movil/icon-192.png" alt="" class="pin-icon">
        <h2 id="pinTitle">Introduce tu PIN</h2>
        <div id="pinDots" class="pin-dots"><span></span><span></span><span></span><span></span></div>
        <div id="pinErr" class="pin-err"></div>
        <div id="pinPad" class="pin-pad">
          <button type="button" data-pin="1">1</button>
          <button type="button" data-pin="2">2</button>
          <button type="button" data-pin="3">3</button>
          <button type="button" data-pin="4">4</button>
          <button type="button" data-pin="5">5</button>
          <button type="button" data-pin="6">6</button>
          <button type="button" data-pin="7">7</button>
          <button type="button" data-pin="8">8</button>
          <button type="button" data-pin="9">9</button>
          <button type="button" data-pin="clear" class="pin-fn">C</button>
          <button type="button" data-pin="0">0</button>
          <button type="button" data-pin="back" class="pin-fn">⌫</button>
        </div>
        <button id="pinCancelBtn" class="secondary-btn hidden" type="button" style="width:100%;margin-top:14px">Cancelar</button>
      </div>
    </div>

    <!-- Toast de notificaciones -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/movil/offline.js?v=8"></script>
  <script src="/movil/extras.js?v=8"></script>
  <script src="/movil/app.js?v=8"></script>
</body>
</html>
